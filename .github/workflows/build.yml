name: Build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default.
permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback (about a minute): lints plus the Foundation-only SnapticKit
  # library and its tests, built with the open-source Swift toolchain.
  kit-linux:
    runs-on: ubuntu-24.04
    container: swift:5.10-jammy
    permissions:
      contents: read
    # Containers default to sh; the steps use pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          set -o pipefail
          ./scripts/lint.sh 2>&1 | tee lint.log

      - name: Build SnapticKit and tests
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log

      - name: Test SnapticKit
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log

      # Job logs may be unreachable from where results are read; annotations are not.
      - name: Report errors as annotations
        if: failure()
        run: ./scripts/ci-annotate.sh kit-linux lint.log build.log test.log

  # Runs the repository's own code, so it only ever gets read access.
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One exact Xcode, so the compiler and SDK can't change underneath us.
      - name: Select Xcode
        run: |
          XCODE=/Applications/Xcode_16.4.app
          if [ ! -d "$XCODE" ]; then
            echo "Xcode 16.4 is not on this runner image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Lint
        run: |
          set -o pipefail
          ./scripts/lint.sh 2>&1 | tee lint.log

      - name: Build (debug, with tests)
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log

      # Helpers must not inherit pipe ends (PLAN §14.1): both children exit once we die.
      - name: Helper self-test (debug)
        run: |
          set -o pipefail
          ./scripts/selftest-helpers.sh .build/debug/Snaptic 2>&1 | tee selftest.log

      - name: Warnings summary
        if: always()
        run: |
          {
            echo "### Compiler warnings"
            if [ -f build.log ]; then grep -E ': warning:' build.log | sort -u | head -200 || true; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The universal release build runs only for pushes (feature branches,
      # main, tags); pull requests get the faster native debug build above.
      - name: Build universal app
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          ARCHS="arm64 x86_64" ./scripts/build-app.sh 2>&1 | tee universal.log

      - name: Check no private classes are linked
        if: github.event_name == 'push'
        run: |
          BIN=build/Snaptic.app/Contents/MacOS/Snaptic
          if nm -u -arch all "$BIN" | grep -E '_OBJC_CLASS_\$_(CGVirtualDisplay|MPDisplay|OSDManager|CBBlueLightClient)'; then
            echo "Private Objective-C classes must be looked up at runtime, never linked." >&2
            exit 1
          fi

      - name: Helper self-test (universal, and under Rosetta when available)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          ./scripts/selftest-helpers.sh build/Snaptic.app/Contents/MacOS/Snaptic 2>&1 | tee -a selftest.log
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            SELFTEST_ARCH=x86_64 ./scripts/selftest-helpers.sh build/Snaptic.app/Contents/MacOS/Snaptic 2>&1 | tee -a selftest.log
          fi

      - name: Report errors as annotations
        if: failure()
        run: ./scripts/ci-annotate.sh macos lint.log build.log test.log universal.log selftest.log

      - name: Package
        if: github.event_name == 'push'
        run: ditto -c -k --keepParent build/Snaptic.app build/Snaptic.zip

      # Only pushes to main and tags publish a downloadable app.
      - name: Upload app
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Snaptic
          path: build/Snaptic.zip

  # Signs provenance for builds of main and release tags only. It never runs
  # repository code, so only this job holds the signing permissions.
  attest:
    needs: build
    # Attestations are only available for public repositories on standard plans.
    if: >-
      github.event_name == 'push' &&
      github.event.repository.visibility == 'public' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Snaptic

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Snaptic.zip

  # Publishes the built app as a GitHub Release for version tags, so the
  # website's download link (releases/latest/download/Snaptic.zip) works.
  # Like attest, it never runs repository code.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Snaptic

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Works whether the tag was pushed from git (no release yet) or the
        # release was published on GitHub first (attach the app to it).
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Snaptic.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Snaptic.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Snaptic ${TAG#v}" \
              --generate-notes
          fi
