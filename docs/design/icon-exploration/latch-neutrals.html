<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snaptic — Latch in neutrals</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#eee)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--ring,#9cc5ff);outline-offset:3px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}.hint{font-size:12px;color:var(--muted-foreground,#999)}.toggle{display:flex;gap:3px;background:var(--secondary,#242426);border-radius:9px;padding:3px}.toggle button{border:0;background:transparent;border-radius:6px;padding:6px 10px;font-size:12px}.toggle button[aria-pressed=true]{background:var(--card,#444)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.concept{display:block;width:100%;text-align:left;padding:0;overflow:hidden;border:1px solid var(--border,#333);border-radius:var(--radius,14px);background:var(--card,#1a1a1c)}.concept[aria-pressed=true]{outline:2px solid var(--ring,#afc5f7);outline-offset:2px}.art{display:flex;justify-content:center;align-items:center;height:190px;background:#e4e4e7}.art svg{width:170px;height:170px;filter:drop-shadow(0 9px 6px #0002)}.meta{padding:13px 14px 15px;min-height:95px}.heading{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:650}.number{font-family:var(--font-mono,monospace);font-size:10px;color:var(--muted-foreground,#999)}.desc{display:block;margin-top:5px;color:var(--muted-foreground,#999);font-size:12px;line-height:1.45;font-weight:400}.detail{margin-top:20px;display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;padding:16px;background:var(--card,#1a1a1c);border-radius:var(--radius,14px);border:1px solid var(--border,#333)}.large{width:190px;height:190px}.detail h2{margin:0 0 7px;font-size:19px;font-weight:600}.detail p{margin:0;color:var(--muted-foreground,#999);font-size:12px;line-height:1.5}.samples{display:flex;align-items:flex-end;gap:20px;margin-top:18px}.sample{display:flex;align-items:center;flex-direction:column;gap:7px;font-size:10px;color:var(--muted-foreground,#999)}.sample svg{display:block}.footnote{font-size:11px;line-height:1.5;margin-top:10px;color:var(--muted-foreground,#999)}.dark-backdrop .art{background:#0d0d0f}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:155px}.art svg{width:140px;height:140px}.detail{grid-template-columns:120px 1fr;gap:12px}.large{width:120px;height:120px}.samples{gap:12px}.meta{padding:10px;min-height:105px}.toolbar{align-items:flex-start}.hint{max-width:170px}.detail h2{font-size:16px}}
</style></head><body>
<div class="toolbar"><span class="hint">Latch · Website palette</span><div class="toggle" role="group" aria-label="Preview background"><button data-mode="light" aria-pressed="true">Light backdrop</button><button data-mode="dark" aria-pressed="false">Dark backdrop</button></div></div>
<main><div class="grid" id="grid"></div><section class="detail" id="detail" aria-live="polite"></section></main>
<p class="footnote">Original Latch geometry preserved · Colors from snaptic.dev · Previews at 64, 32 and 16 CSS pixels</p>
<script>
const concepts=[
{"id": "onyx", "name": "Onyx", "label": "01", "bg": ["#222227", "#0d0d0f"], "fg": ["#ffffff", "#f4f4f5"], "highlight": "#ffffff", "desc": "Off-white on charcoal. Closest to the website.", "detail": "The website\u2019s off-white foreground on its charcoal surfaces. My recommended default: crisp, quiet and easy to recognize.",art:(p,c)=>`<g transform="rotate(-32 128 128)"><path d="M119 65H100C75 65 58 83 58 108v39c0 25 17 44 42 44h19v-34h-16c-7 0-11-5-11-12v-35c0-7 4-11 11-11h16Z" fill="url(#${p}ink)"/><path d="M137 65h19c25 0 42 18 42 43v39c0 25-17 44-42 44h-19v-34h16c7 0 11-5 11-12v-35c0-7-4-11-11-11h-16Z" fill="url(#${p}ink)"/><path d="M99 68h17M140 68h15" stroke="${c.highlight}" stroke-width="2" stroke-linecap="round"/></g>`},
{"id": "chalk", "name": "Chalk", "label": "02", "bg": ["#ffffff", "#f4f4f5"], "fg": ["#27272c", "#0d0d0f"], "highlight": "#5c5c64", "desc": "The same palette, with the contrast reversed.", "detail": "A bright alternative using the same website colors. The dark clasp keeps the original Latch\u2019s visual weight.",art:(p,c)=>`<g transform="rotate(-32 128 128)"><path d="M119 65H100C75 65 58 83 58 108v39c0 25 17 44 42 44h19v-34h-16c-7 0-11-5-11-12v-35c0-7 4-11 11-11h16Z" fill="url(#${p}ink)"/><path d="M137 65h19c25 0 42 18 42 43v39c0 25-17 44-42 44h-19v-34h16c7 0 11-5 11-12v-35c0-7-4-11-11-11h-16Z" fill="url(#${p}ink)"/><path d="M99 68h17M140 68h15" stroke="${c.highlight}" stroke-width="2" stroke-linecap="round"/></g>`},
{"id": "graphite", "name": "Graphite", "label": "03", "bg": ["#27272c", "#18181b"], "fg": ["#f4f4f5", "#8e8e96"], "highlight": "#ffffff", "desc": "A softer silver mark on a dark gray base.", "detail": "A slightly more dimensional treatment. The website\u2019s muted gray shades the mark, while the dark base keeps it grounded.",art:(p,c)=>`<g transform="rotate(-32 128 128)"><path d="M119 65H100C75 65 58 83 58 108v39c0 25 17 44 42 44h19v-34h-16c-7 0-11-5-11-12v-35c0-7 4-11 11-11h16Z" fill="url(#${p}ink)"/><path d="M137 65h19c25 0 42 18 42 43v39c0 25-17 44-42 44h-19v-34h16c7 0 11-5 11-12v-35c0-7-4-11-11-11h-16Z" fill="url(#${p}ink)"/><path d="M99 68h17M140 68h15" stroke="${c.highlight}" stroke-width="2" stroke-linecap="round"/></g>`}
];
let serial=0,selected='onyx';
function icon(c,size=256){const p='icon'+serial++;return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="${p}bg" x2=".2" y2="1"><stop stop-color="${c.bg[0]}"/><stop offset="1" stop-color="${c.bg[1]}"/></linearGradient><linearGradient id="${p}ink" x2=".3" y2="1"><stop stop-color="${c.fg[0]}"/><stop offset="1" stop-color="${c.fg[1]}"/></linearGradient><linearGradient id="${p}edge" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".48"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs><path d="M73 22H183C221 22 234 35 234 73V183C234 221 221 234 183 234H73C35 234 22 221 22 183V73C22 35 35 22 73 22Z" fill="#000" opacity=".13" transform="translate(0 3)"/><path d="M73 22H183C221 22 234 35 234 73V183C234 221 221 234 183 234H73C35 234 22 221 22 183V73C22 35 35 22 73 22Z" fill="url(#${p}bg)" stroke="url(#${p}edge)" stroke-width="1.5"/>${c.art(p,c)}</svg>`}
function select(id){selected=id;document.querySelectorAll('.concept').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const c=concepts.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<div class="large">${icon(c,190)}</div><div><h2>${c.label} / ${c.name}</h2><p>${c.detail}</p><div class="samples">${[64,32,16].map(s=>`<div class="sample">${icon(c,s)}<span>${s} px</span></div>`).join('')}</div></div>`;document.querySelector('.large svg').style.cssText='width:100%;height:100%'}
document.getElementById('grid').innerHTML=concepts.map(c=>`<button class="concept" data-id="${c.id}" aria-pressed="false" aria-label="Inspect ${c.name}"><span class="art">${icon(c,170)}</span><span class="meta" style="display:block"><span class="heading">${c.name}<span class="number">${c.label}</span></span><span class="desc">${c.desc}</span></span></button>`).join('');
document.querySelectorAll('.concept').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('dark-backdrop',b.dataset.mode==='dark');document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));select(selected);
</script></body></html>
