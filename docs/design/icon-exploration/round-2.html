<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snaptic — Icon exploration, round 2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#eee)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--ring,#9cc5ff);outline-offset:3px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}.hint{font-size:12px;color:var(--muted-foreground,#999)}.toggle{display:flex;gap:3px;background:var(--secondary,#242426);border-radius:9px;padding:3px}.toggle button{border:0;background:transparent;border-radius:6px;padding:6px 10px;font-size:12px}.toggle button[aria-pressed=true]{background:var(--card,#444)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.concept{display:block;width:100%;text-align:left;padding:0;overflow:hidden;border:1px solid var(--border,#333);border-radius:var(--radius,14px);background:var(--card,#1a1a1c)}.concept[aria-pressed=true]{outline:2px solid var(--ring,#afc5f7);outline-offset:2px}.art{display:flex;justify-content:center;align-items:center;height:190px;background:#e8e7e4}.art svg{width:170px;height:170px;filter:drop-shadow(0 9px 6px #0002)}.meta{padding:13px 14px 15px;min-height:95px}.heading{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:650}.number{font-family:var(--font-mono,monospace);font-size:10px;color:var(--muted-foreground,#999)}.desc{display:block;margin-top:5px;color:var(--muted-foreground,#999);font-size:12px;line-height:1.45;font-weight:400}.detail{margin-top:20px;display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;padding:16px;background:var(--card,#1a1a1c);border-radius:var(--radius,14px);border:1px solid var(--border,#333)}.large{width:190px;height:190px}.detail h2{margin:0 0 7px;font-size:19px;font-weight:600}.detail p{margin:0;color:var(--muted-foreground,#999);font-size:12px;line-height:1.5}.samples{display:flex;align-items:flex-end;gap:20px;margin-top:18px}.sample{display:flex;align-items:center;flex-direction:column;gap:7px;font-size:10px;color:var(--muted-foreground,#999)}.sample svg{display:block}.footnote{font-size:11px;line-height:1.5;margin-top:10px;color:var(--muted-foreground,#999)}.mono svg{filter:grayscale(1)}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:155px}.art svg{width:140px;height:140px}.detail{grid-template-columns:120px 1fr;gap:12px}.large{width:120px;height:120px}.samples{gap:12px}.meta{padding:10px;min-height:105px}.toolbar{align-items:flex-start}.hint{max-width:170px}.detail h2{font-size:16px}}
</style></head><body>
<div class="toolbar"><span class="hint">Round 02 · Select a direction to inspect</span><div class="toggle" role="group" aria-label="Color study"><button data-mode="color" aria-pressed="true">Color</button><button data-mode="mono" aria-pressed="false">Grayscale</button></div></div>
<main><div class="grid" id="grid"></div><section class="detail" id="detail" aria-live="polite"></section></main>
<p class="footnote">Original vector studies · Small previews shown at 64, 32 and 16 CSS pixels · Concept artwork, not installed app assets</p>
<script>
const concepts=[
{id:'latch',name:'Latch',label:'01',bg:['#e7f785','#bdcf45'],desc:'Two pieces. One satisfying snap.',detail:'A compact magnetic clasp. The separated ends make a distinctive silhouette, with a little tension before everything clicks into place.',art:(p)=>`<g transform="rotate(-32 128 128)"><path d="M119 65H100C75 65 58 83 58 108v39c0 25 17 44 42 44h19v-34h-16c-7 0-11-5-11-12v-35c0-7 4-11 11-11h16Z" fill="url(#${p}ink)"/><path d="M137 65h19c25 0 42 18 42 43v39c0 25-17 44-42 44h-19v-34h16c7 0 11-5 11-12v-35c0-7-4-11-11-11h-16Z" fill="url(#${p}ink)"/><path d="M99 68h17M140 68h15" stroke="#65754a" stroke-width="2" stroke-linecap="round"/></g>`},
{id:'swift',name:'Swift',label:'02',bg:['#4489f1','#173fb9'],desc:'A little paper bird, always in motion.',detail:'A folded swift with one long wing and a sharp beak. A light, fast companion for moving around your Mac.',art:(p)=>`<path d="M54 137 109 126 151 59 146 114 204 93 169 139 178 186 132 158 84 183 103 151Z" fill="#0d2c8e" opacity=".4" transform="translate(0 5)"/><path d="M51 133 109 122 151 55 145 111 205 89 167 136 176 182 130 154 82 179 102 147Z" fill="#f4fbff"/><path d="m109 122 42-67-21 99-28-7Z" fill="#c1e7ff"/><path d="m130 154 75-65-38 47 9 46Z" fill="#89bfff"/><path d="m51 133 58-11-7 25Z" fill="#e8f8ff"/><path d="m130 154 15-43 60-22Z" fill="#ffffff"/>`},
{id:'orbit',name:'Orbit',label:'03',bg:['#fc9c57','#e64c2e'],desc:'A warm, sculpted loop with momentum.',detail:'An off-center loop with a polished end cap. A physical little object that suggests continuity, movement and staying active.',art:(p)=>`<g transform="rotate(-35 128 128)"><path d="M155 80c-41-24-85 2-85 48 0 37 27 65 60 65 35 0 60-26 60-60" fill="none" stroke="#ad3723" stroke-width="39" stroke-linecap="round" transform="translate(0 5)"/><path d="M155 75c-41-24-85 2-85 48 0 37 27 65 60 65 35 0 60-26 60-60" fill="none" stroke="url(#${p}cream)" stroke-width="39" stroke-linecap="round"/><circle cx="190" cy="128" r="19.5" fill="#ffe1b0"/><ellipse cx="190" cy="124" rx="13" ry="10" fill="#fff2d6" opacity=".7"/><path d="M145 69c-30-12-61 6-66 36" fill="none" stroke="#fff8e3" stroke-width="3" opacity=".7" stroke-linecap="round"/></g>`},
{id:'owl',name:'Night owl',label:'04',bg:['#3d455c','#181c2e'],desc:'An alert little companion with attitude.',detail:'A wide-eyed owl, cut from a single soft shape. The most characterful direction; its alert expression gives Awake a friendly face.',art:(p)=>`<path d="M65 65 102 83c17-6 35-6 52 0l37-18-6 61c13 46-14 71-57 72-43-1-70-26-57-72Z" fill="url(#${p}lavender)"/><path d="M76 86c8 15 27 19 52 20 25-1 44-5 52-20l-5 35c-5 21-21 33-47 48-26-15-42-27-47-48Z" fill="#e9e4ff"/><ellipse cx="103" cy="123" rx="19" ry="23" fill="#34304b"/><ellipse cx="153" cy="123" rx="19" ry="23" fill="#34304b"/><ellipse cx="108" cy="120" rx="6" ry="9" fill="#f7f4ff"/><ellipse cx="148" cy="120" rx="6" ry="9" fill="#f7f4ff"/><path d="m119 150 9 13 9-13Z" fill="#ffca75"/><path d="M99 178q29 13 58 0" fill="none" stroke="#9b8cd5" stroke-width="3" stroke-linecap="round"/>`},
{id:'shuttle',name:'Shuttle',label:'05',bg:['#eeeae2','#cfcac0'],desc:'Three colors, woven into one tool.',detail:'Three ribbon ends meet in a single continuous shape. A nod to Snaptic’s three modules, with a softer, more crafted feel.',art:(p)=>`<g transform="rotate(-30 128 128)"><path d="M82 72h52a34 34 0 0 1 34 34v78h-35v-76H82Z" fill="#1c3e3a" opacity=".18" transform="translate(0 6)"/><path d="M82 69h52a34 34 0 0 1 34 34v78h-35v-76H82Z" fill="url(#${p}green)"/><path d="M82 69v80a34 34 0 0 0 34 34h52v-35h-51V69Z" fill="url(#${p}coral)"/><path d="M82 112h35v37h16v34h-17a34 34 0 0 1-34-34Z" fill="#e5a03d"/><path d="M84 71h31v77" fill="none" stroke="#ffc59b" stroke-width="2" opacity=".7"/><path d="M135 107v40" stroke="#145f5e" stroke-width="2"/></g>`},
{id:'pulse',name:'Pulse',label:'06',bg:['#383c40','#141719'],desc:'A precise, tactile control for your Mac.',detail:'A mint switch nested in machined graphite. The narrow diagonal cut adds an identifying detail to a simple hardware-inspired object.',art:(p)=>`<rect x="61" y="60" width="134" height="140" rx="50" fill="#080b0c"/><rect x="63" y="58" width="130" height="137" rx="49" fill="#646e6d"/><rect x="64" y="61" width="128" height="133" rx="48" fill="#111a1b"/><rect x="71" y="65" width="114" height="118" rx="41" fill="#154d43"/><rect x="71" y="61" width="114" height="114" rx="41" fill="url(#${p}mint)"/><path d="m139 87-27 38h24l-17 28" fill="none" stroke="#1d4c40" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 80q8-10 24-10h35" fill="none" stroke="#e0ffed" stroke-width="2" opacity=".75" stroke-linecap="round"/><circle cx="128" cy="188" r="2" fill="#a2f3c5"/>`}
];
let serial=0,selected='latch';
function icon(c,size=256){const p='icon'+serial++;return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="${p}bg" x2=".2" y2="1"><stop stop-color="${c.bg[0]}"/><stop offset="1" stop-color="${c.bg[1]}"/></linearGradient><linearGradient id="${p}ink" x2=".3" y2="1"><stop stop-color="#344132"/><stop offset="1" stop-color="#121c17"/></linearGradient><linearGradient id="${p}cream" x2=".3" y2="1"><stop stop-color="#fff6dd"/><stop offset=".5" stop-color="#ffe5b5"/><stop offset="1" stop-color="#dfab70"/></linearGradient><linearGradient id="${p}lavender" x2="0" y2="1"><stop stop-color="#d4c7ff"/><stop offset="1" stop-color="#a997e0"/></linearGradient><linearGradient id="${p}green" x2="1" y2="1"><stop stop-color="#4abca3"/><stop offset="1" stop-color="#18736c"/></linearGradient><linearGradient id="${p}coral" x2=".2" y2="1"><stop stop-color="#f48460"/><stop offset="1" stop-color="#ca492f"/></linearGradient><linearGradient id="${p}mint" x2=".2" y2="1"><stop stop-color="#c9ffdd"/><stop offset="1" stop-color="#65cda2"/></linearGradient><linearGradient id="${p}edge" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".48"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs><path d="M73 22H183C221 22 234 35 234 73V183C234 221 221 234 183 234H73C35 234 22 221 22 183V73C22 35 35 22 73 22Z" fill="#000" opacity=".13" transform="translate(0 3)"/><path d="M73 22H183C221 22 234 35 234 73V183C234 221 221 234 183 234H73C35 234 22 221 22 183V73C22 35 35 22 73 22Z" fill="url(#${p}bg)" stroke="url(#${p}edge)" stroke-width="1.5"/>${c.art(p)}</svg>`}
function select(id){selected=id;document.querySelectorAll('.concept').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const c=concepts.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<div class="large">${icon(c,190)}</div><div><h2>${c.label} / ${c.name}</h2><p>${c.detail}</p><div class="samples">${[64,32,16].map(s=>`<div class="sample">${icon(c,s)}<span>${s} px</span></div>`).join('')}</div></div>`;document.querySelector('.large svg').style.cssText='width:100%;height:100%'}
document.getElementById('grid').innerHTML=concepts.map(c=>`<button class="concept" data-id="${c.id}" aria-pressed="false" aria-label="Inspect ${c.name}"><span class="art">${icon(c,170)}</span><span class="meta" style="display:block"><span class="heading">${c.name}<span class="number">${c.label}</span></span><span class="desc">${c.desc}</span></span></button>`).join('');
document.querySelectorAll('.concept').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('mono',b.dataset.mode==='mono');document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));select(selected);
</script></body></html>
